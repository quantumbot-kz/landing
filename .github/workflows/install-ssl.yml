name: Install landing SSL

on:
  workflow_dispatch:

jobs:
  install-ssl:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect hosting account and try user-level SSL paths
        uses: appleboy/ssh-action@v1.2.2
        env:
          FULLCHAIN_B64: ${{ secrets.LANDING_SSL_FULLCHAIN_B64 }}
          PRIVKEY_B64: ${{ secrets.LANDING_SSL_KEY_B64 }}
          ISP_USER: ${{ secrets.SSH_USER }}
          ISP_PASS: ${{ secrets.SSH_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: FULLCHAIN_B64,PRIVKEY_B64,ISP_USER,ISP_PASS
          command_timeout: 2m
          script: |
            set -euo pipefail
            umask 077
            echo "whoami=$(whoami) host=$(hostname) home=$HOME"
            echo '=== home ==='
            ls -la "$HOME"
            echo '=== ssl-like paths ==='
            find "$HOME" -maxdepth 4 \( -iname '*ssl*' -o -iname '*.crt' -o -iname '*.pem' -o -iname '*.key' -o -iname '*nginx*' \) 2>/dev/null | head -n 100
            echo '=== public_html ==='
            ls -la "$HOME/public_html" | head -n 30
            echo '=== quantum ==='
            ls -la "$HOME/quantum" | head -n 30
            echo '=== bins ==='
            command -v mgrctl || true
            command -v nginx || true
            echo '=== local panels ==='
            (command -v ss >/dev/null && ss -lnt | grep -E '1500|1501|443|80' || netstat -lnt 2>/dev/null | grep -E '1500|1501' || true)
            for url in \
              'https://127.0.0.1:1500/ispmgr' \
              'https://127.0.0.1:1501/ispmgr' \
              'http://127.0.0.1:1500/ispmgr'
            do
              echo "curl $url"
              curl -skI --max-time 5 "$url" | head -n 8 || true
            done
            echo '=== ispmanager API via authinfo (no password print) ==='
            if [ -n "${ISP_USER:-}" ] && [ -n "${ISP_PASS:-}" ]; then
              for base in 'https://127.0.0.1:1500/ispmgr' 'https://vh438.timeweb.ru:1500/ispmgr'; do
                echo "try $base func=sslcert"
                curl -sk --max-time 8 "$base?out=text&authinfo=${ISP_USER}:${ISP_PASS}&func=sslcert" | head -n 40 || true
              done
            fi
            echo '=== writable ssl dirs ==='
            for p in "$HOME/ssl" "$HOME/.ssl" "$HOME/conf" "$HOME/etc"; do
              if [ -d "$p" ]; then
                echo "DIR $p"
                ls -la "$p"
              fi
            done
            echo DIAGNOSTIC_DONE
